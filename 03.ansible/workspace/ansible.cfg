[defaults]
inventory = inventories/prod/hosts
roles_path = roles
remote_user = kosa

host_key_checking = False

interpreter_python = auto_silent

stdout_callback = ansible.builtin.default
callback_result_format = yaml

forks = 20

log_path = ./ansible.log

callbacks_enabled = ansible.builtin.profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# 9. SSH 파이프라이닝 — 태스크당 SSH 연결 횟수 감소 (3회 → 1회)
pipelining = True
# 10. SSH 멀티플렉싱 — 동일 호스트 재접속 시 기존 소켓 재사용 (핸드쉐이크 생략)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=10
