---
- name: 패키지 최신 업데이트
  yum:
    name: "*"
    state: latest
    update_cache: true

- name: HAProxy 및 WireGuard 및 jq 설치
  yum:
    name:
      - haproxy
      - wireguard-tools
      - jq
      - socat
    state: present

- name: WireGuard 디렉토리 생성
  file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: WireGuard 키 생성
  shell: |
    wg genkey | tee /etc/wireguard/private.key | wg pubkey > /etc/wireguard/public.key
    chmod 600 /etc/wireguard/private.key
    chmod 644 /etc/wireguard/public.key
  args:
    creates: /etc/wireguard/private.key

- name: WireGuard 클라이언트 설정 배포
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  notify: restart wireguard

- name: IP forwarding 활성화
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: WireGuard 서비스 활성화
  service:
    name: wg-quick@wg0
    state: started
    enabled: true

- name: HAProxy 설정 디렉토리 생성
  file:
    path: /etc/haproxy
    state: directory
    mode: '0755'

- name: HAProxy ACL 디렉토리 생성
  file:
    path: /etc/haproxy/acl
    state: directory
    mode: '0755'

- name: Cloudburst ACL 파일 생성
  file:
    path: /etc/haproxy/acl/cloudburst_active.txt
    state: touch
    mode: '0644'

- name: HAProxy 설정 파일 배포
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: restart haproxy

- name: Cloudburst 컨트롤 스크립트 배포
  template:
    src: cloudburst-control.sh.j2
    dest: /usr/local/bin/cloudburst-control.sh
    mode: '0755'

- name: HAProxy 서비스 활성화 및 시작
  service:
    name: haproxy
    state: started
    enabled: true

- name: 방화벽 포트 개방 (firewalld)
  firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 80/tcp
    - 443/tcp
    - 8404/tcp
    - 51820/udp
  when: ansible_facts.services['firewalld.service'] is defined

- name: firewalld 리로드
  command: firewall-cmd --reload
  when: ansible_facts.services['firewalld.service'] is defined
  changed_when: false